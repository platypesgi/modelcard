[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "platypesgi-modelcard"
version = "0.1.0"
description = "生成模型说明卡模板，把来源、适用范围与已知限制写成必须填的字段。"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "platypesgi" }]
keywords = ["documentation", "model-card", "transparency", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://platypesgi.github.io"
Repository = "https://github.com/platypesgi/modelcard"
Issues = "https://github.com/platypesgi/modelcard/issues"

[project.scripts]
modelcard = "modelcard:main"

[tool.setuptools]
py-modules = ["modelcard"]
